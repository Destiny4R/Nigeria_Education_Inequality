# /etc/nginx/sites-available/eduineq  - HTTPS termination in front of gunicorn.  Replace eduineq.example.org; certificates e.g. via certbot.
# The site has NO login by design.  If the operator does not want strangers to run analyses, restrict access HERE (allow/deny, VPN, basic auth at the proxy).
limit_req_zone $binary_remote_addr zone=eduineq:10m rate=10r/s;

server {
    listen 80;
    server_name eduineq.example.org;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name eduineq.example.org;
    ssl_certificate     /etc/letsencrypt/live/eduineq.example.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/eduineq.example.org/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    client_max_body_size 1m;                       # the site accepts no uploads

    location /static/ {
        alias /srv/eduineq/educational-inequality-nigeria/staticfiles/;
        expires 7d;
        add_header Cache-Control "public";
    }
    location / {
        limit_req zone=eduineq burst=30 nodelay;
        proxy_pass http://unix:/run/eduineq/gunicorn.sock;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 300s;
    }
}
